# CS 375/376 Course Objectives
# Organized around two pillars: Tuneable Machines (TM) and Optimization Games (OG)
# Plus Overall objectives for context and implications

# =============================================================================
# TUNEABLE MACHINES (TM) - How neural networks compute
# =============================================================================

- id: TM-MLPParts
  pillar: Tuneable Machines
  class: 375
  description: I can compute the forward pass through a two-layer classification neural network by hand (or in simple code) and explain the purpose and operation of each part.
  criteria:
    - I can identify the sequence of operations in a two-layer classification neural network.
    - I can compute the output of the matrix multiplication and the activation function for each layer.
    - I can define the following terms in the context of a neural network - input, output, weights, biases, activation function, activation value, logit, probability, and loss.
  notes: |
    I'm considering this Met when a student has computed all of the pieces by hand, even if they've done it in isolation, even if they didn't do a whole forward pass by hand, if they also have a clear understanding of why nonlinear activations are needed.

- id: TM-LinearLayers
  pillar: Tuneable Machines
  class: 375
  description: I can implement linear (fully-connected) layers using efficient parallel code.
  criteria:
    - I can write a correct linear layer computation (matrix multiply plus bias) given weight and bias tensors.
    - I can explain why linear layers are called "fully connected."
    - I can predict the shape of the output given input and weight dimensions.

- id: TM-ActivationFunctions
  pillar: Tuneable Machines
  class: 375
  description: I can implement and explain elementwise nonlinear activation functions.
  criteria:
    - I can implement ReLU and explain what it does to negative vs positive values.
    - I can explain why networks need nonlinear activations between layers.
  notes: |
    We're focusing on ReLU for CS 375. It would be nice if students also had some familiarity with other activations (GELU, Swish, etc.), but I'm not explicitly teaching that.

- id: TM-Softmax
  pillar: Tuneable Machines
  class: 375
  description: I can implement softmax and explain its role in classification networks.
  criteria:
    - I can implement softmax and explain why it produces a valid probability distribution.
    - I can explain when and why we use softmax in neural networks.
    - I can identify the relationship between softmax and cross-entropy loss.

- id: TM-DataFlow
  pillar: Tuneable Machines
  class: 375
  description: I can draw clear diagrams of the data flow through a neural network, labeling each layer and the tensor shapes at each step.
  criteria:
    - I can draw a diagram showing layers, activations, and the flow of data through an MLP.
    - I can label the shapes of tensors at each point in the network (including batch dimension).
    - I can distinguish between parameters (weights, biases) and activations in my diagrams.
    - I can trace how a single input becomes a prediction and then a loss value.
  notes: |
    This overlaps with TM-MLPParts and TM-LinearLayers, so I'll be flexible about what Met means here.

- id: TM-DotProduct
  pillar: Tuneable Machines
  class: 375
  description: I can compute and reason about dot products of vectors.
  criteria:
    - I can compute the dot product of two vectors by hand.
    - I can explain that dot products measure similarity or alignment between vectors.
    - I can explain what it means geometrically when two vectors have a dot product of zero.

- id: TM-TensorOps
  pillar: Tuneable Machines
  class: 375
  description: I can reason about matrix multiplication and multi-dimensional tensor shapes.
  criteria:
    - Given tensor shapes, I can predict whether a matrix multiplication is valid and what shape results.
    - I can interpret what each dimension of a tensor represents in context (e.g., batch, features, classes).
    - I can diagnose and fix shape mismatch errors by tracing dimensions through operations.

- id: TM-Embeddings
  pillar: Tuneable Machines
  class: 375
  description: I can explain how neural networks represent data as vectors (embeddings) where geometric relationships encode meaning.
  criteria:
    - I can explain that similar items should have similar embeddings (high dot product or small distance).
    - I can interpret a 2D visualization of embeddings and explain why clusters form.
    - I can explain why learned embeddings can be more useful than hand-crafted features.
    - I can describe how pretrained embeddings enable transfer learning.

- id: TM-RepresentationLearning
  pillar: Tuneable Machines
  class: 375
  description: I can explain how a neural network learns useful internal representations through training.
  criteria:
    - I can explain that hidden layers transform data to make the task easier for subsequent layers.
    - I can give an example of a representation that would make classification easier (e.g., linearly separable).
    - I can explain why deeper networks can learn more complex representations.

- id: TM-Autograd
  pillar: Tuneable Machines
  class: 375
  description: I can explain the purpose of automatic differentiation and identify how it is used in PyTorch code.
  criteria:
    - I can explain that autograd computes gradients of the loss with respect to all parameters.
    - I can identify which tensors require gradients and why (requires_grad=True).
    - I can explain what loss.backward() and optimizer.step() do in a training loop.

- id: TM-Implement-TrainingLoop
  pillar: Tuneable Machines
  class: 375
  description: I can implement a basic training loop in PyTorch.
  criteria:
    - I can write a training loop that iterates over batches and updates parameters.
    - I can correctly order the steps - forward pass, loss computation, backward pass, optimizer step, zero gradients.
    - I can add validation evaluation at appropriate points in training.
    - I can track and plot training and validation metrics over epochs.

- id: TM-Convolution
  pillar: Tuneable Machines
  class: 375
  status: optional
  description: I can explain the purpose of convolution layers for image processing.
  criteria:
    - I can explain why convolutions are useful for images (local patterns, translation invariance, parameter sharing).
    - I can describe what a filter/kernel does at a high level.

# 376-specific Tuneable Machines objectives
# Decision log: TM-Scaling merged into TM-LLM-Compute (D12 resolved); criteria added (26sp revision)

- id: TM-LLM-Embeddings
  pillar: Tuneable Machines
  class: 376
  description: I can identify various types of embeddings (tokens, hidden states, output, key, and query) in a language model and explain their purpose.
  criteria:
    - I can distinguish between token embeddings (input lookup table) and context embeddings (output of transformer layers).
    - I can explain how context embeddings incorporate information from other tokens via attention.
    - I can describe how the final context embedding is used to produce next-token logits (dot product with token embeddings).

- id: TM-SelfAttention
  pillar: Tuneable Machines
  class: 376
  description: I can explain the purpose and components of a self-attention layer (key, query, value; multi-head attention; positional encodings).
  criteria:
    - I can explain what queries, keys, and values represent and how they interact (dot product → softmax → weighted sum).
    - I can compute a simple attention calculation by hand given Q, K, V vectors.
    - I can explain why multi-head attention is useful (different heads can attend to different relationship types).
    - I can explain why causal masking is needed for autoregressive models.

- id: TM-Architectures
  pillar: Tuneable Machines
  class: 376
  status: optional
  description: I can compare and contrast the following neural architectures - CNN, RNN, and Transformer.
  criteria:
    - I can describe at least one strength and one limitation of each architecture for sequence modeling.
    - I can explain why Transformers have largely replaced RNNs for language tasks.

- id: TM-TransformerDataFlow
  pillar: Tuneable Machines
  class: 376
  description: I can identify the shapes of data flowing through a Transformer-style language model.
  criteria:
    - Given model hyperparameters (layers, heads, hidden dim, vocab size, seq length), I can state the shape of key tensors (embeddings, Q/K/V, attention weights, logits).
    - I can trace how a single token's representation changes from input embedding through attention and MLP layers to output logits.
    - I can explain the role of residual connections in preserving information across transformer layers.

- id: TM-LLM-Generation
  pillar: Tuneable Machines
  class: 376
  description: I can extract and interpret model outputs (token logits) and use them to generate text.
  criteria:
    - I can explain the autoregressive generation loop (prompt → logits → sample → append → repeat).
    - I can explain how temperature affects the sampling distribution (higher = more random).
    - I can write pseudocode for a basic text generation algorithm given a model and tokenizer.

- id: TM-LLM-Compute
  pillar: Tuneable Machines
  class: 376
  description: I can analyze how computational requirements scale with model size and context length, and reason about the feasibility of training and running generative AI systems.
  criteria:
    - I can estimate memory requirements for a model given its parameter count and numerical precision.
    - I can explain how compute scales with parameters and sequence length.
    - I can describe at least two optimization techniques (e.g., quantization, KV caching) and their trade-offs.
    - I can evaluate whether a given model can run on specific hardware (e.g., 12GB GPU, laptop CPU, cloud API).

# =============================================================================
# OPTIMIZATION GAMES (OG) - How we frame and solve learning problems
# =============================================================================

- id: OG-ProblemFraming-Supervised
  pillar: Optimization Games
  class: 375
  description: I can frame a problem as a supervised learning task with appropriate inputs, targets, and loss function.
  criteria:
    - I can identify what the input features and target variable should be for a given problem.
    - I can determine whether the task is regression or classification.
    - I can select an appropriate loss function for the task type (MSE for regression, cross-entropy for classification).
    - I can articulate what "success" means for the task and how to measure it.

- id: OG-ProblemFraming-Paradigms
  pillar: Optimization Games
  class: 375
  description: I can distinguish between supervised learning, self-supervised learning, and reinforcement learning.
  criteria:
    - I can identify which paradigm applies to a given learning scenario.
    - I can explain what provides the learning signal in each paradigm (labels, prediction task, rewards).
    - I can give an example problem suited to each paradigm.
    - I can explain why imitation (supervised) differs from exploration (RL) in what can be learned.

- id: OG-LossFunctions
  pillar: Optimization Games
  class: 375
  description: I can select and compute appropriate loss functions for regression and classification tasks.
  criteria:
    - I can compute MSE loss given predictions and targets.
    - I can compute categorical cross-entropy loss given predicted probabilities and true class.
    - I can explain why we use cross-entropy rather than accuracy as a training loss.
    - I can identify which loss function is appropriate for a given task type.

- id: OG-DataDistribution
  pillar: Optimization Games
  class: 375
  status: optional
  description: I can reason about how the distribution of training data shapes what a model learns.
  criteria:
    - I can identify ways a training distribution might differ from deployment (selection bias, domain shift).
    - I can explain how data augmentation expands the effective training distribution.
    - I can contrast supervised learning (distribution given) with RL (distribution shaped by exploration).
    - I can give an example of how a model might succeed on training data but fail in practice.

- id: OG-Eval-Experiment
  pillar: Optimization Games
  class: both
  description: I can design and execute valid experiments to evaluate model performance.
  criteria:
    - I partition data appropriately (train/val/test) before any model fitting.
    - I can explain why we need held-out data and what goes wrong without it.
    - I can select metrics appropriate to the task and stakeholder needs.
    - I can interpret learning curves (loss/metric vs epoch) to understand training dynamics.

- id: OG-Generalization
  pillar: Optimization Games
  class: 375
  description: I can diagnose and address generalization problems in trained models.
  criteria:
    - I can identify overfitting from learning curves (train loss decreasing while val loss increases).
    - I can identify underfitting (both train and val loss remain high).
    - I can propose appropriate interventions (more data, augmentation, regularization, adjust model capacity).
    - I can explain the bias-variance tradeoff at an intuitive level.

- id: OG-Implement-Validate
  pillar: Optimization Games
  class: 375
  description: I apply validation techniques correctly and proactively.
  criteria:
    - I split data into train/validation before fitting, without being reminded.
    - I evaluate on validation data to select hyperparameters, not training data.
    - I spot-check model predictions on specific examples to build intuition.
    - I can explain why validation performance is a better estimate of real-world performance than training performance.

- id: OG-LLM-APIs
  pillar: Optimization Games
  class: both
  status: optional
  description: I can apply LLM APIs (such as the Chat Completions API) to build AI-powered applications.
  criteria:
    - I can construct appropriate API calls with system and user messages.
    - I can process and use the model's response in an application.
    - I can identify tasks where an LLM API is and is not appropriate.

- id: OG-Pretrained
  pillar: Optimization Games
  class: 375
  description: I can explain the benefits and risks of using pretrained models.
  criteria:
    - I can explain how pretrained models provide useful features without task-specific training data.
    - I can describe the "body + head" pattern (pretrained feature extractor with task-specific classifier).
    - I can identify risks of pretrained models (bias, domain mismatch, licensing).
    - I can explain when fine-tuning vs feature extraction is appropriate.

- id: OG-Theory-SGD
  pillar: Optimization Games
  class: 375
  description: I can explain how stochastic gradient descent uses gradients to improve model performance.
  criteria:
    - I can explain that the gradient points in the direction of steepest increase of the loss.
    - I can explain why we move in the negative gradient direction to reduce loss.
    - I can explain why we use batches (stochastic) rather than the full dataset.
    - I can identify the role of learning rate and what happens if it's too large or too small.

# 376-specific Optimization Games objectives
# Decision log: OG-LLM-Advanced → OG-LLM-ContextAndTools (D11 resolved);
# OG-ICL folded into OG-LLM-ContextAndTools (D13 agreed); TM-Scaling removed (D12 agreed); criteria added (26sp revision)

- id: OG-LLM-Tokenization
  pillar: Optimization Games
  class: 376
  description: I can explain how inputs get chunked into tokens, how outputs are generated token by token, and how this affects usage of the model.
  criteria:
    - I can describe the tokenization pipeline (text → token IDs → embeddings) and its reverse.
    - I can explain why subword tokenization is used instead of character-level or word-level approaches.
    - I can identify at least one consequence of tokenization choices (e.g., multilingual bias, difficulty counting syllables, spelling quirks).

- id: OG-LLM-ConversationAsDocument
  pillar: Optimization Games
  class: 376
  description: I can explain how a conversation with an LLM can be represented as a carefully structured document, including system messages, tool calls, and multimodal inputs and outputs.
  criteria:
    - I can describe how system, user, and assistant turns are serialized into a single token sequence.
    - I can explain how function/tool calls fit into the conversation document format.
    - I can explain how this framing allows a next-token predictor to behave as a dialogue agent.

- id: OG-LLM-Prompting
  pillar: Optimization Games
  class: 376
  description: I can critique and refine prompts to improve the quality of responses from an LLM.
  criteria:
    - I can identify why a given prompt produces poor results (ambiguity, missing context, wrong framing).
    - I can apply at least two prompting strategies (e.g., role assignment, few-shot examples, chain-of-thought, structured output constraints).
    - I can explain the difference between system, user, and assistant messages and when to use each.

- id: OG-LLM-ContextAndTools
  pillar: Optimization Games
  class: 376
  description: I can construct effective inputs for LLM-powered systems and use tool calling to connect models to external information.
  criteria:
    - I can trace how a prompt is assembled from components (system message, examples, tool results, conversation history) and explain why each part is there.
    - I can build an LLM-powered system that uses structured outputs and at least one tool call.
    - I can identify when adding context (examples, retrieved docs) helps vs. when it wastes the context window or distracts the model.
    - I can diagnose failures in an LLM-powered system (e.g., hallucinating instead of using retrieved context, irrelevant tool results, prompt injection).

- id: OG-LLM-Eval
  pillar: Optimization Games
  class: 376
  description: I can apply and critically analyze evaluation strategies for generative models.
  criteria:
    - I can explain why evaluating generative systems is harder than evaluating classifiers.
    - I can describe at least two evaluation approaches (e.g., perplexity, human preference, task-specific metrics, LLM-as-judge).
    - I can identify limitations of automatic metrics for open-ended generation.
    - I can design a basic evaluation strategy for a specific LLM application.
  instructorNote: |
    These are important but they're aspirational given the current state of the course. TODO: find places in the course to dig into these -- at least Week 6!

- id: OG-SelfSupervised
  pillar: Optimization Games
  class: 376
  description: I can explain how self-supervised learning can be used to train foundation models on massive datasets without labeled data.
  criteria:
    - I can explain next-token prediction as a self-supervised task (the "labels" come from the data itself).
    - I can connect cross-entropy loss and perplexity to the idea of prediction quality and "surprise."
    - I can explain why self-supervised pretraining enables capabilities that weren't explicitly trained for.

- id: OG-LLM-Train
  pillar: Optimization Games
  class: 376
  description: I can describe the overall process of training a state-of-the-art dialogue LLM such as Llama or OLMo.
  notes: |
    Scaling-laws narrative (Chinchilla, emergent abilities) captured here rather than as a separate
    TM-Scaling objective.
  criteria:
    - I can identify the three main stages of training (pretraining, supervised fine-tuning, RLHF/RLVR) and what each accomplishes.
    - I can explain what data is used at each stage and where human input enters the process.
    - I can describe how the model's behavior changes across stages (mimicry → instruction following → aligned responses).
    - I can explain the basic insight of scaling laws (more data + more compute → predictably better models) and its practical implications.

- id: OG-Theory-Feedback
  pillar: Optimization Games
  class: 376
  status: optional
  description: I can explain how feedback tuning can improve the performance and reliability of a model or agent.
  criteria:
    - I can explain the basic RLHF loop (generate samples → collect preferences → train reward model → optimize policy).
    - I can explain what a reward signal is and give examples for different tasks (human preference, code correctness, factual accuracy).
    - I can articulate why the reward signal is the hard part (reward hacking, specification gaming, proxy objectives).
    - I can describe how RLVR (RL with verifiable rewards) simplifies the reward problem for certain tasks.

# =============================================================================
# OVERALL - Context, implications, and dispositions
# =============================================================================

- id: Overall-Explain
  pillar: Overall
  status: optional
  class: 375
  description: I can explain basic AI concepts to a non-technical audience without major errors.
  criteria:
    - Given a technical concept (e.g., "training a neural network"), I can produce an accessible analogy or explanation.
    - My explanations avoid anthropomorphizing AI systems in misleading ways.
    - I can identify when a popular-press AI claim is misleading or exaggerated.

- id: Overall-Faith
  pillar: Overall
  class: 375
  status: optional
  description: I can articulate connections between Christian concepts and AI development, demonstrating genuine engagement.
  criteria:
    - I can identify at least one way a Christian concept (e.g., imago Dei, shalom, stewardship) informs how I think about a specific AI capability or application.
    - I can engage respectfully with perspectives on faith and its implications that differ from my own.

- id: Overall-Impact
  pillar: Overall
  class: both
  description: I can analyze real-world situations to identify potential negative impacts of AI systems.
  criteria:
    - Given a scenario, I can identify at least two distinct stakeholder groups who might be affected differently.
    - I can articulate how training data distribution might differ from deployment conditions.
    - I can identify feedback loops where model outputs might affect future training data or user behavior.
    - I can flag concerns that warrant careful analysis before deployment.

- id: Overall-Dispositions
  pillar: Overall
  status: optional
  class: both
  description: I demonstrate growth mindset and integrity in my AI learning and practice.
  criteria:
    - I can identify a specific instance where I persisted through difficulty in this course.
    - I can describe how I use AI tools in ways that support rather than replace my learning.
    - I can articulate my own boundaries for AI assistance and why I hold them.

- id: Overall-History
  pillar: Overall
  class: 375
  status: optional
  description: I can trace current AI technologies back to historical developments.
  criteria:
    - I can name at least one historical development (pre-2015) that enabled current deep learning.
    - I can place the "deep learning revolution" in approximate historical context.

- id: Overall-PhilNarrative
  pillar: Overall
  class: both
  status: optional
  description: I can engage with philosophical questions raised by AI systems.
  criteria:
    - I can articulate at least one philosophical question that AI raises (e.g., consciousness, intelligence, creativity, agency).
    - I can distinguish between what AI systems do and what those capabilities might mean.
    - I can identify assumptions embedded in how we talk about AI (e.g., "AI thinks", "AI understands").

- id: Overall-LLM-Failures
  pillar: Overall
  class: 376
  description: I can identify common types of failures in LLMs, such as hallucination (confabulation) and bias.
  criteria:
    - I can explain what hallucination/confabulation is and why LLMs are prone to it.
    - I can identify at least two other failure modes (e.g., bias amplification, prompt injection, sycophancy, inconsistency across turns).
    - I can describe strategies for mitigating specific failure modes in a given application context.
